server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Nén Gzip cho static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA Fallback: Mọi route React Router đều chuyển về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dài hạn cho static assets có hash nội dung
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Không cache index.html để đảm bảo người dùng luôn nhận bản build mới nhất sau deploy
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

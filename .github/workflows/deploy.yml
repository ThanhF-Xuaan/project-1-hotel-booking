name: Deploy to OCI Production (smartstay.space)

on:
  push:
    branches: [ develop, deploy-OCI ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/hotel_backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/hotel_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_API_URL=
            VITE_KEYCLOAK_URL=https://smartstay.space
            VITE_KEYCLOAK_REALM=hotel-realm
            VITE_KEYCLOAK_CLIENT_ID=hotel-frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/hotel_frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/hotel_frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSH to OCI VM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate SSH Secrets
        run: |
          if [ -z "${{ secrets.OCI_SSH_HOST }}" ]; then
            echo "❌ LỖI: Secret OCI_SSH_HOST chưa được thiết lập hoặc bị rỗng!"
            exit 1
          fi
          if [ -z "${{ secrets.OCI_SSH_USERNAME }}" ]; then
            echo "❌ LỖI: Secret OCI_SSH_USERNAME chưa được thiết lập hoặc bị rỗng!"
            exit 1
          fi
          if [ -z "${{ secrets.OCI_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ LỖI: Secret OCI_SSH_PRIVATE_KEY chưa được thiết lập hoặc bị rỗng!"
            exit 1
          fi
          echo "✅ Tất cả SSH secrets (Host, Username, Private Key) đều đã được cung cấp."

      - name: Deploy via SSH to OCI VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USERNAME }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY,TARGET_BRANCH,IMAGE_TAG
          script_stop: true
          script: |
            set -Eeuo pipefail

            DEPLOY_DIR="$HOME/hotel-booking-repo"
            cd "$DEPLOY_DIR"

            REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/hotel_backend:${IMAGE_TAG}"
            FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/hotel_frontend:${IMAGE_TAG}"
            export BACKEND_IMAGE FRONTEND_IMAGE

            # 1. Ghi nhận commit đang chạy ổn định trước khi deploy
            PREVIOUS_COMMIT=$(git rev-parse HEAD || echo "")
            echo "📌 Commit hiện tại đang chạy trên server: ${PREVIOUS_COMMIT:-none}"

            # Hàm rollback tự động khi gặp sự cố
            rollback() {
              local failed_line="$1"
              echo "⚠️ [ALERT] Lệnh tại dòng $failed_line thất bại!"
              if [ -n "$PREVIOUS_COMMIT" ]; then
                echo "🔄 [ROLLBACK] Bắt đầu khôi phục về commit cũ: $PREVIOUS_COMMIT..."
                git reset --hard "$PREVIOUS_COMMIT" || true
                sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
                echo "✅ [ROLLBACK HOÀN TẤT] Hệ thống đã trở về phiên bản an toàn trước đó."
              else
                echo "❌ Không có commit trước đó để rollback."
              fi
              exit 1
            }

            trap 'rollback $LINENO' ERR

            echo "=== 1. KÉO CẤU HÌNH MỚI NHẤT TỪ GITHUB ==="
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Đã đồng bộ lên commit mới: $NEW_COMMIT"

            echo "=== 2. KIỂM TRA TỆP .env.prod BẢO MẬT ==="
            if [ ! -f .env.prod ]; then
              echo "❌ LỖI: Tệp .env.prod không tồn tại trên máy chủ OCI!"
              exit 1
            fi
            echo "✅ Tệp .env.prod đang hoạt động ổn định trên OCI."

            echo "=== 3. ĐĂNG NHẬP GHCR TRÊN MÁY CHỦ OCI ==="
            echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "=== 4. KÉO DOCKER IMAGES MỚI NHẤT TỪ GHCR ==="
            sudo docker pull "$BACKEND_IMAGE"
            sudo docker pull "$FRONTEND_IMAGE"

            # Gắn tag latest nội bộ để tương thích với docker compose
            sudo docker tag "$BACKEND_IMAGE" "ghcr.io/${REPO_LOWER}/hotel_backend:latest"
            sudo docker tag "$FRONTEND_IMAGE" "ghcr.io/${REPO_LOWER}/hotel_frontend:latest"

            echo "=== 5. CHẠY DATABASE LIQUIBASE MIGRATION ==="
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm liquibase

            echo "=== 6. RESTART CÁC CONTAINER VỚI IMAGES MỚI ==="
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 7. KIỂM TRA HEALTHCHECK 3 TẦNG (RETRY TRONG 90 GIÂY) ==="
            HEALTHY=false
            for i in $(seq 1 18); do
              echo "Kiểm tra trạng thái hệ thống (lần $i/18)..."
              
              # Tầng 1: Nginx Ingress Gateway
              NGINX_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -H "Host: smartstay.space" https://127.0.0.1/nginx-health || true)
              
              # Tầng 2: Spring Boot Application Context qua OpenAPI Docs
              DOCS_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -H "Host: smartstay.space" https://127.0.0.1/v3/api-docs || true)

              # Tầng 3: Database Query thực tế vào PostgreSQL qua Public Search API
              DB_RES=$(curl -k -s -H "Host: smartstay.space" https://127.0.0.1/api/v1/public/booking-search/destinations || true)
              
              if [ "$NGINX_CODE" = "200" ] && [ "$DOCS_CODE" = "200" ] && [[ "$DB_RES" =~ "\"code\":200" ]]; then
                echo "✅ Tầng 1 Nginx (200), Tầng 2 Spring Boot Context (200) và Tầng 3 PostgreSQL Query (code: 200) đều hoạt động xuất sắc!"
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Healthcheck không đạt yêu cầu sau 90 giây! Chi tiết: Nginx=$NGINX_CODE, Docs=$DOCS_CODE"
              rollback "$LINENO"
            fi

            echo "=== 8. DỌN DẸP DANGLING IMAGES ĐỂ TIẾT KIỆM Ổ ĐĨA 50GB ==="
            sudo docker image prune -f

            echo "🎉 DEPLOYMENT THÀNH CÔNG TRÊN HTTPS://SMARTSTAY.SPACE!"

server:
  port: 8080

spring:
  application:
    name: hotel-booking

  datasource:
    # Lấy từ file env, nếu không có thì lấy giá trị sau dấu 2 chấm
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_booking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate 
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/hotel-realm}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    com.vn.edu.utc.hotel_booking_system: DEBUG
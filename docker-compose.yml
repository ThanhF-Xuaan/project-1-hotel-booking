services:
  # ==========================================
  # 1. DATABASE (POSTGRESQL)
  # ==========================================
  postgres_db:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    container_name: hotel_postgres
    restart: no
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. CACHE (REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. IAM / SECURITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: hotel_keycloak
    restart: no
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_URL: http://localhost:8081
    volumes:
      - ./keycloak/hotel-realm.json:/opt/keycloak/data/import/hotel-realm.json:ro
      - kc_data:/opt/keycloak/data/h2
    ports:
      - "8081:8080" # Map ra 8081 để khớp với cấu hình cũ của bạn

  # ==========================================
  # 4. SPRING BOOT BACKEND
  # ==========================================
  backend:
    build: 
      context: ./backend
    container_name: hotel_backend
    restart: no
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres_db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/hotel-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/hotel-realm/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hotel-backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_CHAT_MODEL_PROVIDER: ${AI_CHAT_MODEL_PROVIDER:-none}
      AI_EMBEDDING_MODEL_PROVIDER: ${AI_EMBEDDING_MODEL_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ==========================================
  # 5. REACT VITE FRONTEND
  # ==========================================
  frontend:
    build: 
      context: ./frontend
    container_name: hotel_frontend
    restart: no
    ports:
      - "3000:3000"
    volumes:
      # Map thẳng code từ thư mục thật vào Container để giữ Hot-Reload
      - ./frontend:/app
      # Đóng băng thư mục node_modules trong Container, không cho máy thật chép đè vào
      - /app/node_modules
    environment:
      # Ép Vite lắng nghe sự thay đổi file (phù hợp với môi trường Docker)
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend

# Khai báo các Volume dùng chung
volumes:
  pg_vector_data:
  redis_data:
  kc_data:

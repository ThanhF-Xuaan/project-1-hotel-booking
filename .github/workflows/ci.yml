name: Codebase CI Quality Gate

on:
  pull_request:
    branches: [ develop, main, deploy-OCI ]
  push:
    branches: [ develop, main, deploy-OCI ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebase-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Ho_Chi_Minh
  JAVA_TOOL_OPTIONS: '-Duser.timezone=Asia/Ho_Chi_Minh'

jobs:
  backend-verification:
    name: Backend Unit & Slice Tests (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TESSERACT_EXE: /usr/bin/tesseract
      T12_REDIS_IT: 'true'
      T12_REDIS_EXCLUSIVE_VERIFIED: 'true'
      T12_REDIS_HOST: 127.0.0.1
      T12_REDIS_PORT: '16379'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          tesseract --version
          tesseract --list-langs
      - name: Verify exclusive empty Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          test "$(docker exec "$REDIS_CONTAINER" redis-cli ping)" = PONG
          test "$(docker exec "$REDIS_CONTAINER" redis-cli dbsize)" = 0
      - name: Backend regression (explicit CI scope)
        working-directory: backend
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          '-Dtest=*Test,!HotelBookingApplicationTests,!LodgingExportPostgresTest,!OcrMultipartServletRuntimeTest'
          -DfailIfNoTests=true test
      - name: Require complete selected test evidence
        if: always()
        run: >-
          python3 tools/ci/verify_surefire.py backend/target/surefire-reports
          --minimum 1504
          --require-suite vn.edu.utc.hotel_booking.modules.ai.ocr.TesseractOcrVisionAdapterTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.ocr.controller.IdentityDocumentOcrControllerTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.advisor.session.RedisRoomAdvisorSessionStoreRealRedisTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.demo.utility.UtilityDemoApiTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.demo.group.GroupDemoApiTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.demo.data.DemoDataProviderTest
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.StayGuestReviewRegressionTest
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.UtilityScopeReviewRegressionTest
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.LodgingQueueReviewRegressionTest
          --require-suite vn.edu.utc.hotel_booking.modules.finance.service.PayrollPrecisionReviewRegressionTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.advisor.session.SessionSnapshotFollowupTest
          --require-suite vn.edu.utc.hotel_booking.modules.finance.service.PayrollHeaderFollowupTest
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.StayGuestTimeFollowupTest
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.OperationConflictHttpFollowupTest
          --require-suite vn.edu.utc.hotel_booking.modules.ai.advisor.service.AdvisorDependencyReviewRegressionTest
          --output "${{ runner.temp }}/member1-ci/backend-summary.json"
      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-summary
          path: ${{ runner.temp }}/member1-ci/backend-summary.json
          if-no-files-found: error
          retention-days: 7

  frontend-verification:
    name: Frontend Lint & Typecheck (Node 22 / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint Code Quality
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: TypeScript Compile & Vite Build Validation
        working-directory: frontend
        run: |
          npm run build
          npm audit --audit-level=high

      - name: Install browser for isolated U22 UI checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: U22 synthetic UI states, authorization and request races
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 13000 --strictPort > "$RUNNER_TEMP/u22-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:13000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:13000/ > /dev/null
          npx playwright test e2e/browser/u22-demo-ui.spec.ts e2e/browser/u22-utility-ui.spec.ts e2e/browser/group-demo-ui.spec.ts e2e/browser/t12-session-reset.spec.ts e2e/browser/stay-guests-race.spec.ts e2e/browser/ocr-review.spec.ts

  contracts-tooling:
    name: Contracts, tooling and route safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install tooling dependencies
        run: |
          python -m pip install -r tools/ci/requirements.txt
          npm ci --prefix frontend
      - name: Validate current contracts and route safety
        run: |
          python tools/t12/validate_r1_contracts.py --artifacts-only
          node --test tools/ci/test_member1_routes.cjs
          node tools/ci/verify_member1_routes.cjs
          python -m unittest discover -s tools/ci -p 'test*.py' -v
          python -m unittest discover -s tools/acceptance -p 'test*.py' -v
      - name: Test isolated RAG runtime configuration
        shell: pwsh
        run: ./tools/acceptance/Test-RagRuntimeConfiguration.ps1
      - name: Replay immutable historical source audits (not current application verification)
        shell: bash
        run: |
          historical="$RUNNER_TEMP/member1-historical-audit"
          git worktree add --detach "$historical" eedeaf9fda584c8d10629d09961d86e2821fe7b3
          cd "$historical"
          npm ci --prefix frontend
          python tools/t12/validate_r1_contracts.py --reviewed-widget-sources
          python -m unittest discover -s tools/t12 -p 'test*.py' -v
          python -m unittest discover -s tools/member1 -p 'test*.py' -v
          python tools/t12/verify_current_core_reaudit.py
          node tools/t12/verify_lazy_route_reaudit.cjs
          node tools/t12/verify_u14_source_reaudit.cjs

  analytics-db:
    name: Analytics synthetic PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Create disposable local PostgreSQL
        shell: python
        run: |
          import os,secrets,subprocess,time
          password=secrets.token_hex(24)
          print('::add-mask::'+password)
          subprocess.run(['docker','run','-d','--name','m1-analytics-ci','--label','com.docker.compose.project=hotel-m1-acceptance','--label','com.docker.compose.service=acceptance_postgres','-e','POSTGRES_DB=m1_analytics_test','-e','POSTGRES_USER=postgres','-e','POSTGRES_PASSWORD='+password,'-p','127.0.0.1:15435:5432','postgres:16-alpine'],check=True,capture_output=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('M1_DEMO_DB_URL=jdbc:postgresql://localhost:15435/m1_analytics_test\nM1_DEMO_IT_USER=postgres\nM1_DEMO_IT_PASSWORD='+password+'\n')
          readiness_env=os.environ.copy()
          readiness_env['PGPASSWORD']=password
          for attempt in range(40):
              # The image's initialization server accepts Unix sockets before final TCP startup.
              r=subprocess.run(['docker','exec','-e','PGPASSWORD','m1-analytics-ci','psql','-X','-qAt','-h','127.0.0.1','-U','postgres','-d','m1_analytics_test','-v','ON_ERROR_STOP=1','-c','SELECT 1'],capture_output=True,text=True,env=readiness_env,timeout=5)
              if r.returncode==0 and r.stdout.strip()=='1': break
              time.sleep(1)
          else: raise RuntimeError('PostgreSQL unavailable')
      - name: Provision synthetic schema and restricted reader
        run: python tools/acceptance/analytics_demo_db.py --action seed --container m1-analytics-ci --database m1_analytics_test --evidence-directory "$RUNNER_TEMP/analytics-seed"
      - name: Configure private reader
        shell: python
        run: |
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'analytics-seed/runtime.private.json').read_text())
          print('::add-mask::'+r['M1_DEMO_DB_PASSWORD'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k in ('M1_DEMO_DB_USER','M1_DEMO_DB_PASSWORD'): f.write(k+'='+r[k]+'\n')
      - name: PostgreSQL parity, privilege and outage checks
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress '-Dtest=PostgresDemoDataProviderIT' -DfailIfNoTests=true test
      - name: Seed drift, atomicity and rollback checks
        run: python tools/acceptance/check_analytics_demo_provisioning.py --container m1-analytics-ci --evidence-directory "$RUNNER_TEMP/analytics-provisioning"
      - name: Require executed PostgreSQL evidence
        run: >-
          python tools/ci/verify_surefire.py backend/target/surefire-reports
          --minimum 6
          --require-suite vn.edu.utc.hotel_booking.modules.ai.demo.data.PostgresDemoDataProviderIT
          --output "${{ runner.temp }}/analytics-summary.json"
      - name: Cleanup owned disposable container
        if: always()
        run: docker rm -f m1-analytics-ci

  operation-postgres:
    name: Operation PostgreSQL concurrency & migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Provision exclusive synthetic PostgreSQL and explicit migration context
        run: python tools/ci/provision_operation_postgres.py start
      - name: Real concurrent writes, preflight rollback and export regression
        working-directory: backend
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          '-Dtest=UtilityConcurrencyPostgresIT,StayGuestDedupPostgresIT,ActiveStayMigrationPostgresIT,LodgingExportPostgresTest'
          -DfailIfNoTests=true clean test
      - name: Require executed PostgreSQL evidence
        if: always()
        run: >-
          python tools/ci/verify_surefire.py backend/target/surefire-reports
          --minimum 34
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.UtilityConcurrencyPostgresIT
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.StayGuestDedupPostgresIT
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.ActiveStayMigrationPostgresIT
          --require-suite vn.edu.utc.hotel_booking.modules.operation.service.LodgingExportPostgresTest
          --output "${{ runner.temp }}/operation-summary.json"
      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: operation-summary
          path: ${{ runner.temp }}/operation-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup owned disposable PostgreSQL
        if: always()
        run: python tools/ci/provision_operation_postgres.py cleanup

  docker-validation:
    name: Docker Packaging & Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
          echo "Docker Compose production configuration syntax is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hotel_backend:test
          cache-from: type=gha

      - name: Test Build Frontend Docker Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_API_URL=
            VITE_KEYCLOAK_URL=https://smartstay.space
            VITE_KEYCLOAK_REALM=hotel-realm
            VITE_KEYCLOAK_CLIENT_ID=hotel-frontend
          push: false
          tags: hotel_frontend:test
          cache-from: type=gha

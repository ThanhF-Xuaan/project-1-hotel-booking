services:
  # ==========================================
  # 1. DATABASE (POSTGRESQL)
  # ==========================================
  postgres_db:
    image: postgres:16-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. CACHE (REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. IAM / SECURITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: hotel_keycloak
    restart: unless-stopped
    command: start-dev --import-realm # Tự động import realm khi khởi động
    environment:
      # Tài khoản Admin để đăng nhập giao diện Keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Hostname Configuration (Đồng nhất Issuer URI cho Browser và Backend)
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080" # Map ra 8081 trên máy Host
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Check xem Keycloak đã sẵn sàng (OIDC Discovery & Realm đã READY)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  # ==========================================
  # 4. DATABASE MIGRATION RUNNER (LIQUIBASE DOCKER)
  # ==========================================
  liquibase:
    image: liquibase/liquibase:4.31-alpine
    container_name: hotel_liquibase
    restart: "no" # Chạy xong migration là kết thúc với mã thoát 0
    environment:
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres_db:5432/${DB_NAME}
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db/db-changelog-root.xml
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-master-data,dev-seed}
      LIQUIBASE_LOG_LEVEL: INFO
    command: --search-path=/liquibase/changelog --changelog-file=db/db-changelog-root.xml update
    volumes:
      - ./backend/src/main/resources/db:/liquibase/changelog/db:ro
    depends_on:
      postgres_db:
        condition: service_healthy

  # ==========================================
  # 5. SPRING BOOT BACKEND
  # ==========================================
  backend:
    build: 
      context: ./backend
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: "false" # Đã chạy qua Liquibase Runner container chuyên dụng
      SPRING_REDIS_HOST: redis
      # Cấu hình mạng nội bộ cho Keycloak
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/hotel-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/hotel-realm/protocol/openid-connect/certs
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully # Đợi Liquibase container chạy xong 100%

  # ==========================================
  # 6. REACT VITE FRONTEND
  # ==========================================
  frontend:
    build: 
      context: ./frontend
    container_name: hotel_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Map thẳng code từ thư mục thật vào Container để giữ Hot-Reload
      - ./frontend:/app
      # Đóng băng thư mục node_modules trong Container, không cho máy thật chép đè vào
      - /app/node_modules
    environment:
      # Ép Vite lắng nghe sự thay đổi file (phù hợp với môi trường Docker)
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-hotel-realm}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-hotel-frontend}
    depends_on:
      - backend

# Khai báo các Volume dùng chung
volumes:
  pg_data:
  redis_data:
  keycloak_data:
# ==============================================================================
# UPSTREAM DEFINITIONS (Sử dụng DNS nội bộ của Docker Network)
# ==============================================================================
upstream frontend_dev_upstream {
    server frontend:80;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream keycloak_upstream {
    server keycloak:8080;
    keepalive 32;
}

upstream minio_storage_upstream {
    server minio:9000;
    keepalive 32;
}

# ==============================================================================
# 1. HTTP SERVER (CỔNG 80)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Healthcheck endpoint cho Docker Container
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Bao gồm các location dùng chung (API, Keycloak, Storage, Frontend Vite)
    include /etc/nginx/conf.d/common_locations.inc;
}

# ==============================================================================
# 2. HTTPS SERVER (CỔNG 443) - SSL/TLS TERMINATION
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    # Chứng chỉ SSL/TLS
    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    # Giao thức & Mã hóa bảo mật cao (Modern TLS Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OWASP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Healthcheck endpoint trên HTTPS
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Bao gồm các location dùng chung
    include /etc/nginx/conf.d/common_locations.inc;
}

services:
  # ==========================================
  # 1. DATABASE (POSTGRESQL)
  # ==========================================
  postgres_db:
    image: postgres:16-alpine
    container_name: hotel_postgres
    restart: no
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. CACHE (REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. IAM / SECURITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: hotel_keycloak
    restart: no
    command: start-dev # Chạy chế độ Dev (không bắt buộc HTTPS)
    environment:
      # Tài khoản Admin để đăng nhập giao diện Keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080" # Map ra 8081 để khớp với cấu hình cũ của bạn
    healthcheck:
      # Check xem Keycloak đã sẵn sàng cấp Token chưa
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # 4. SPRING BOOT BACKEND
  # ==========================================
  backend:
    build: 
      context: ./backend
    container_name: hotel_backend
    restart: no
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      # Giữ nguyên cấu hình mạng nội bộ cho Keycloak (không dùng localhost của .env)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/hotel-realm
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ==========================================
  # 5. REACT VITE FRONTEND
  # ==========================================
  frontend:
    build: 
      context: ./frontend
    container_name: hotel_frontend
    restart: no
    ports:
      - "3000:3000"
    volumes:
      # Map thẳng code từ thư mục thật vào Container để giữ Hot-Reload
      - ./frontend:/app
      # Đóng băng thư mục node_modules trong Container, không cho máy thật chép đè vào
      - /app/node_modules
    environment:
      # Ép Vite lắng nghe sự thay đổi file (phù hợp với môi trường Docker)
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

# Khai báo các Volume dùng chung
volumes:
  pg_data:
  redis_data:
server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: hotel-booking

  datasource:
    # Lấy từ file env, nếu không có thì lấy giá trị sau dấu 2 chấm
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_booking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/db-changelog-root.xml
    contexts: ${LIQUIBASE_CONTEXTS:master-data,dev-seed}
    default-schema: public
    drop-first: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none 
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/hotel-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/hotel-realm/protocol/openid-connect/certs}

  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 500
        thread-name-prefix: "async-iam-task-"

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:hotel-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:hotel-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:hotel-backend-secret-key-123456}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    vn.edu.utc.hotel_booking: DEBUG

# =============================================================================
# CẤU HÌNH CỔNG THANH TOÁN (Giai đoạn A — T06 Payment Gateway)
# Mọi secret lấy từ env — mặc định rỗng để app vẫn chạy dev khi chưa có key
# =============================================================================
payment:
  gateway:
    vnpay:
      tmn-id: ${VNPAY_TMN_ID:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      # vnp_ReturnUrl: trình duyệt quay về ĐÂU — trỏ về BE để verify +302 về FE (contract §4)
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/public/payments/vnpay/return}
      # FE result page nhận redirect cuối cùng từ BE /vnpay/return
      fe-result-url: ${VNPAY_FE_RESULT_URL:http://localhost:3000/payment/result}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      url: ${MOMO_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/public/payments/momo/callback}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment/result}

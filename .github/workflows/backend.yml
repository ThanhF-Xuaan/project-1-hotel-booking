name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'keycloak/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'keycloak/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        working-directory: backend
        run: bash ./mvnw --batch-mode verify

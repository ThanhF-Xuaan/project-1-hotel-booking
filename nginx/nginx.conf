user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ẩn số phiên bản Nginx để phòng chống tấn công dò quét lỗ hổng
    server_tokens off;

    # Định dạng Log chi tiết cho API Gateway
    log_format gateway_log '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  gateway_log;

    # Tối ưu hóa I/O và truyền tải tệp
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Hạn mức tải tệp: 50MB (Hỗ trợ hợp đồng PDF 25MB và tệp xuất BI 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # Tối ưu hóa Buffer cho kết nối upstream
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Nén Gzip tối ưu hóa băng thông truyền tải
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Nạp toàn bộ Virtual Host configs
    include /etc/nginx/conf.d/*.conf;
}
